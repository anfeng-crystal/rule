mode: rule

proxy-groups:
  # ===== 开头只保留默认与场景 =====
  - name: ⚙️ 默认策略
    type: select
    proxies: [🧭 自动测速, 🌐 全部节点, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🔌 直连]

  - name: 🇭🇰 香港场景
    type: select
    proxies: [♻️ 香港自动, 🇭🇰 香港节点, 🔯 香港故障转移]

  - name: 🇨🇳 台湾场景
    type: select
    proxies: [♻️ 台湾自动, 🇨🇳 台湾节点, 🔯 台湾故障转移]

  - name: 🇯🇵 日本场景
    type: select
    proxies: [♻️ 日本自动, 🇯🇵 日本节点, 🔯 日本故障转移]

  - name: 🇸🇬 新加坡场景
    type: select
    proxies: [♻️ 新加坡自动, 🇸🇬 新加坡节点, 🔯 新加坡故障转移]

  - name: 🇺🇸 美国场景
    type: select
    proxies: [♻️ 美国自动, 🇺🇸 美国节点, 🔯 美国故障转移]

  - name: 🌍 全部地区
    type: select
    proxies: [♻️ 全部地区自动, 🌍 全部地区节点, 🔯 全部地区故障转移]

  # ===== 业务策略组 =====
  - name: 🤖 AI
    type: select
    proxies: [🇺🇸 美国场景, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 📹 YouTube
    type: select
    proxies: [🇭🇰 香港场景, ⚙️ 默认策略, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🍀 Google
