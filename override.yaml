  - name: 🎮 Steam
    type: select
    proxies: [🇭🇰 香港场景, ⚙️ 默认策略, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 💳 PayPal
    type: select
    proxies: [🇺🇸 美国场景, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🪟 Microsoft
    type: select
    proxies: [⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🍎 Apple
    type: select
    proxies: [🔌 直连, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点]

  - name: 🚀 Speedtest
    type: select
    proxies: [🔌 直连, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点]

  - name: ₿ 数字货币
    type: select
    proxies: [🇺🇸 美国场景, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🌏 境外网站
    type: select
    proxies: [⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🎬 国外流媒体
    type: select
    proxies: [🇸🇬 新加坡场景, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🐟 漏网之鱼
    type: select
    proxies: [⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点, 🔌 直连]

  - name: 🎵 NetEaseMusic
    type: select
    proxies: [🔌 直连, ⚙️ 默认策略, 🇭🇰 香港场景, 🇨🇳 台湾场景, 🇯🇵 日本场景, 🇸🇬 新加坡场景, 🇺🇸 美国场景, 🌍 全部地区, 🌐 全部节点]

  - name: 🏠 大陆网站
    type: select
    proxies: [🔌 直连, ⚙️ 默认策略]

  - name: 📺 大陆流媒体
    type: select
    proxies: [🔌 直连, ⚙️ 默认策略]

  - name: 🛑 广告拦截
    type: select
    proxies: [REJECT, 🔌 直连]

  - name: 🔄 Apple Update
    type: select
    proxies: [🔌 直连, REJECT]

  # ===== 基础/底层组（放到后面） =====
  - name: 🌐 全部节点
    type: select
    include-all: true
    filter: '^((?!(流量|到期|剩余|官网|官方|套餐|重置|订阅|过期|有效期|traffic|expire|official)).)*$'

  - name: 🧭 自动测速
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '^((?!(直连|DIRECT|流量|到期|剩余|官网|官方|套餐|重置|订阅|过期|有效期|traffic|expire|official)).)*$'

  - name: 🔌 直连
    type: select
    proxies: [DIRECT]

  - name: 🇭🇰 香港节点
    type: select
    include-all: true
    filter: '(?i)(香港|🇭🇰|\bHK\b|Hong)'

  - name: ♻️ 香港自动
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '(?i)(香港|🇭🇰|\bHK\b|Hong)'

  - name: 🔯 香港故障转移
    type: fallback
    include-all: true
    interval: 600
    filter: '(?i)(香港|🇭🇰|\bHK\b|Hong)'

  - name: 🇨🇳 台湾节点
    type: select
    include-all: true
    filter: '(?i)(台湾|台灣|台|臺|🇹🇼|\bTW\b|Taiwan)'

  - name: ♻️ 台湾自动
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '(?i)(台湾|台灣|台|臺|🇹🇼|\bTW\b|Taiwan)'

  - name: 🔯 台湾故障转移
    type: fallback
    include-all: true
    interval: 600
    filter: '(?i)(台湾|台灣|台|臺|🇹🇼|\bTW\b|Taiwan)'

  - name: 🇯🇵 日本节点
    type: select
    include-all: true
    filter: '(?i)(日本|🇯🇵|\bJP\b|Japan|Tokyo|Osaka)'

  - name: ♻️ 日本自动
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '(?i)(日本|🇯🇵|\bJP\b|Japan|Tokyo|Osaka)'

  - name: 🔯 日本故障转移
    type: fallback
    include-all: true
    interval: 600
    filter: '(?i)(日本|🇯🇵|\bJP\b|Japan|Tokyo|Osaka)'

  - name: 🇸🇬 新加坡节点
    type: select
    include-all: true
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'

  - name: ♻️ 新加坡自动
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'

  - name: 🔯 新加坡故障转移
    type: fallback
    include-all: true
    interval: 600
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'

  - name: 🇺🇸 美国节点
    type: select
    include-all: true
    filter: '(?i)(美国|美國|🇺🇸|\bUS\b|United\s*States|America|洛杉矶|西雅图)'

  - name: ♻️ 美国自动
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '(?i)(美国|美國|🇺🇸|\bUS\b|United\s*States|America|洛杉矶|西雅图)'

  - name: 🔯 美国故障转移
    type: fallback
    include-all: true
    interval: 600
    filter: '(?i)(美国|美國|🇺🇸|\bUS\b|United\s*States|America|洛杉矶|西雅图)'

  - name: 🌍 全部地区节点
    type: select
    include-all: true
    filter: '^((?!(流量|到期|剩余|官网|官方|套餐|重置|订阅|过期|有效期|traffic|expire|official)).)*$'

  - name: ♻️ 全部地区自动
    type: url-test
    include-all: true
    interval: 600
    tolerance: 20
    filter: '^((?!(直连|DIRECT|流量|到期|剩余|官网|官方|套餐|重置|订阅|过期|有效期|traffic|expire|official)).)*$'

  - name: 🔯 全部地区故障转移
    type: fallback
    include-all: true
    interval: 600
    filter: '^((?!(直连|DIRECT|流量|到期|剩余|官网|官方|套餐|重置|订阅|过期|有效期|traffic|expire|official)).)*$'

